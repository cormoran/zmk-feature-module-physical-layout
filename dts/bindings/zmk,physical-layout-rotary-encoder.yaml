description: Describes one rotary encoder in a physical rotary encoder bundle.

compatible: "zmk,physical-layout-rotary-encoder"

properties:
  x:
    type: int
    required: true
    description: X position in the same coordinate units as ZMK key physical layouts.

  y:
    type: int
    required: true
    description: Y position in the same coordinate units as ZMK key physical layouts.

  size:
    type: int
    required: true
    description: Rotary encoder diameter in the same coordinate units as ZMK key physical layouts.

  r:
    type: int
    default: 0
    description: Rotation angle in tenths of degrees.

  rx:
    type: int
    default: 0
    description: X coordinate of the rotation origin.

  ry:
    type: int
    default: 0
    description: Y coordinate of the rotation origin.
