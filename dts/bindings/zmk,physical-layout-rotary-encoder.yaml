description: Describes one indexed rotary encoder in a physical rotary encoder bundle.

compatible: "zmk,physical-layout-rotary-encoder"

properties:
  index:
    type: int
    required: true
    description: Index into ZMK's official sensor/rotary encoder array.

  x:
    type: int
    required: true
    description: X position in the same coordinate units as ZMK key physical layouts.

  y:
    type: int
    required: true
    description: Y position in the same coordinate units as ZMK key physical layouts.

  size:
    type: int
    required: true
    description: Rotary encoder diameter in millimeters.
