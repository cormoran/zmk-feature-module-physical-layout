description: Describes the physical location of a trackball for custom ZMK Studio rendering.

compatible: "zmk,physical-layout-trackball"

properties:
  display-name:
    type: string
    required: true

  x:
    type: int
    required: true
    description: X position in the same coordinate units as ZMK key physical layouts.

  y:
    type: int
    required: true
    description: Y position in the same coordinate units as ZMK key physical layouts.

  size:
    type: int
    required: true
    description: Trackball diameter in the same coordinate units as ZMK key physical layouts.

  r:
    type: int
    default: 0
    description: Rotation angle in tenths of degrees.

  rx:
    type: int
    default: 0
    description: X coordinate of the rotation origin.

  ry:
    type: int
    default: 0
    description: Y coordinate of the rotation origin.

  linked-device-identifiers:
    type: string-array
    required: true

  linked-subsystems:
    type: string-array
    required: true
