description: |
  Describes the physical location of a non-keyboard module, such as a
  trackball, rotary encoder, or trackpad, for custom ZMK Studio rendering.

compatible: "zmk,physical-layout-device"

properties:
  display-name:
    type: string
    required: true
    description: Human readable label for the physical device.

  device-type:
    type: string
    required: true
    description: Physical device kind, such as trackball, encoder, or trackpad.

  width:
    type: int
    required: true
    description: Width in the same coordinate units as ZMK key physical layouts.

  height:
    type: int
    required: true
    description: Height in the same coordinate units as ZMK key physical layouts.

  x:
    type: int
    required: true
    description: X position in the same coordinate units as ZMK key physical layouts.

  y:
    type: int
    required: true
    description: Y position in the same coordinate units as ZMK key physical layouts.

  r:
    type: int
    default: 0
    description: Rotation angle in tenths of degrees.

  rx:
    type: int
    default: 0
    description: X coordinate of the rotation origin.

  ry:
    type: int
    default: 0
    description: Y coordinate of the rotation origin.

  linked-devices:
    type: phandles
    description: Devices that provide functionality for this physical device.

  linked-subsystems:
    type: string-array
    description: Custom Studio RPC subsystem identifiers matching linked-devices by index.
