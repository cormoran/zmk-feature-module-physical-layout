syntax = "proto3";

package zmk.physical_layouts;

message GetPhysicalLayoutRequest {}

message PhysicalAttrs {
    sint32 width = 1;
    sint32 height = 2;
    sint32 x = 3;
    sint32 y = 4;
    sint32 r = 5;
    sint32 rx = 6;
    sint32 ry = 7;
}

message LinkedDevice {
    string device_identifier = 1;
    string subsystem_identifier = 2;
}

message PhysicalDevice {
    string identifier = 1;
    string display_name = 2;
    string type = 3;
    PhysicalAttrs attrs = 4;
    repeated LinkedDevice links = 5;
}

message GetPhysicalLayoutResponse { repeated PhysicalDevice devices = 1; }

message Request {
    oneof request_type { GetPhysicalLayoutRequest get_physical_layout = 1; }
}

message ErrorResponse { string message = 1; }

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        GetPhysicalLayoutResponse physical_layout = 2;
    }
}
